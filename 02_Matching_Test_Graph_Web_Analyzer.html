<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실사용매칭시험 데이터 Analyzer V2.0 ⚡ (Authored by JH Lee)</title>
<style>
  :root {
    --bg-main: #EEF2F6;
    --bg-group: #F8FAFC;
    --bg-input: #FFFFFF;
    --text-main: #1F2933;
    --text-title: #243B53;
    --text-dark: #102A43;
    --border-group: #B8C2CC;
    --border-input: #BCCCDC;
    --btn-blue: #2F80ED;
    --btn-blue-hover: #1C64D1;
    --btn-blue-active: #164E9E;
    --btn-red: #D92D20;
    --btn-red-hover: #B42318;
    --btn-red-active: #7A271A;
    --sel-bg: #BEE3F8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-main);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "NanumGothic", sans-serif;
    font-size: 10pt;
    color: var(--text-main);
    user-select: none;
  }

  /* Window Title Bar to match Desktop GUI Tone & Manner */
  #app-wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  #window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 34px;
    padding: 0 12px;
    background: linear-gradient(90deg, #1E293B 0%, #243B53 100%);
    color: #FFFFFF;
    font-size: 10pt;
    font-weight: 700;
    letter-spacing: 0.2px;
    border-bottom: 1px solid #0F172A;
    flex-shrink: 0;
  }

  #window-header .title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #window-header .status-badge {
    font-size: 8.5pt;
    font-weight: 500;
    color: #CBD5E1;
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* Main Horizontal Splitter Layout */
  #main-container {
    display: flex;
    flex: 1;
    width: 100%;
    min-height: 0;
    padding: 8px;
    gap: 0;
  }

  /* Left Panel */
  #left-panel {
    width: 380px;
    min-width: 260px;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    height: 100%;
    flex-shrink: 0;
  }

  /* Splitter Handles */
  .splitter-h {
    width: 8px;
    cursor: col-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .splitter-h::after {
    content: "";
    width: 2px;
    height: 36px;
    background-color: #CBD5E1;
    border-radius: 1px;
    transition: background-color 0.15s;
  }
  .splitter-h:hover::after, .splitter-h.active::after {
    background-color: var(--btn-blue);
  }

  .splitter-v {
    height: 8px;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .splitter-v::after {
    content: "";
    height: 2px;
    width: 36px;
    background-color: #CBD5E1;
    border-radius: 1px;
    transition: background-color 0.15s;
  }
  .splitter-v:hover::after, .splitter-v.active::after {
    background-color: var(--btn-blue);
  }

  /* Right Panel */
  #right-panel {
    flex: 1;
    min-width: 400px;
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  #graph-panel {
    flex: 65;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    padding: 10px 10px 8px 10px;
    gap: 8px;
  }

  #analysis-panel {
    flex: 30;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    padding: 8px 10px 10px 10px;
  }

  /* QGroupBox Equivalent */
  .group-box {
    position: relative;
    border: 1px solid var(--border-group);
    border-radius: 8px;
    margin-top: 9px;
    padding: 14px 8px 8px 8px;
    background-color: var(--bg-group);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .group-box > .group-title {
    position: absolute;
    top: -10px;
    left: 10px;
    padding: 0 5px;
    background-color: var(--bg-group);
    color: var(--text-title);
    font-weight: bold;
    font-size: 10pt;
    line-height: 1.2;
    border-radius: 3px;
  }

  #grp-x {
    flex: 2;
    min-height: 74px;
  }

  #grp-y {
    flex: 10;
    gap: 6px;
  }

  #grp-selected-y {
    flex: 10;
    gap: 6px;
  }

  /* QPushButton Equivalent */
  .btn {
    background-color: var(--btn-blue);
    color: #FFFFFF;
    border: none;
    border-radius: 7px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 10pt;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.12s ease;
    flex-shrink: 0;
  }
  .btn:hover {
    background-color: var(--btn-blue-hover);
  }
  .btn:active {
    background-color: var(--btn-blue-active);
  }
  .btn:disabled {
    background-color: #94A3B8;
    cursor: not-allowed;
  }

  .btn-exit {
    background-color: var(--btn-red);
    padding: 10px 11px;
    font-weight: 700;
    margin-top: auto;
  }
  .btn-exit:hover {
    background-color: var(--btn-red-hover);
  }
  .btn-exit:active {
    background-color: var(--btn-red-active);
  }

  /* QLabel Equivalent */
  .lbl {
    color: var(--text-title);
    font-size: 10pt;
    line-height: 1.35;
    word-break: break-all;
  }

  /* QListWidget Equivalent */
  .list-widget {
    flex: 1;
    background-color: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: 6px;
    padding: 4px;
    overflow-y: auto;
    overflow-x: auto;
    min-height: 0;
    list-style: none;
  }

  .list-widget li {
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-main);
    font-size: 9.5pt;
    line-height: 1.35;
    margin-bottom: 1px;
  }

  .list-widget li:hover {
    background-color: #F1F5F9;
  }

  .list-widget li.selected {
    background-color: var(--sel-bg);
    color: var(--text-dark);
    font-weight: 600;
  }

  /* QLineEdit Equivalent */
  .line-edit {
    background-color: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 9.5pt;
    color: var(--text-main);
    width: 100%;
    outline: none;
  }
  .line-edit:focus {
    border-color: var(--btn-blue);
    box-shadow: 0 0 0 2px rgba(47, 128, 237, 0.15);
  }
  .line-edit::placeholder {
    color: #94A3B8;
  }

  /* Navigation Toolbar (Matplotlib NavigationToolbar2QT style) */
  #mpl-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    background-color: #F8FAFC;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    padding: 3px 8px;
    height: 34px;
    flex-shrink: 0;
  }

  .tool-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 3px 7px;
    cursor: pointer;
    font-size: 9.5pt;
    color: var(--text-title);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tool-btn:hover {
    background-color: #E2E8F0;
    border-color: #CBD5E1;
  }
  .tool-btn.active {
    background-color: var(--sel-bg);
    border-color: #63B3ED;
    color: var(--text-dark);
    font-weight: bold;
  }
  .tool-sep {
    width: 1px;
    height: 18px;
    background-color: #CBD5E1;
    margin: 0 4px;
  }
  #toolbar-coords {
    margin-left: auto;
    font-family: Consolas, "Courier New", monospace;
    font-size: 9pt;
    color: var(--text-title);
  }

  /* Canvas Container */
  #canvas-container {
    flex: 1;
    min-height: 160px;
    background-color: #FFFFFF;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }

  #plot-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Graph Control Group Grid */
  #graph-control-group {
    flex-shrink: 0;
    padding: 14px 10px 10px 10px;
  }

  .control-grid {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .control-grid .btn {
    min-width: 135px;
  }

  /* Analysis Output Group */
  #analysis-group {
    flex: 1;
    height: 100%;
  }

  #analysis-text {
    flex: 1;
    width: 100%;
    height: 100%;
    background-color: #FFFFFF;
    color: var(--text-dark);
    border: 1px solid var(--border-input);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: Consolas, "Courier New", "Malgun Gothic", monospace;
    font-size: 9.5pt;
    line-height: 1.45;
    white-space: pre;
    overflow: auto;
    resize: none;
    outline: none;
    user-select: text;
  }

  /* Loading & Modal Overlay */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .loading-box {
    background: #FFFFFF;
    border-radius: 10px;
    padding: 22px 28px;
    min-width: 340px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    text-align: center;
  }
  .loading-title {
    font-weight: bold;
    font-size: 11pt;
    color: var(--text-title);
    margin-bottom: 10px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #E2E8F0;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  #progress-bar-fill {
    width: 0%;
    height: 100%;
    background: var(--btn-blue);
    transition: width 0.1s linear;
  }
  #loading-status {
    font-size: 9.5pt;
    color: #475569;
  }

  /* Custom Modal Dialog for Messages */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }
  .modal-box {
    background: #FFFFFF;
    border: 1px solid var(--border-group);
    border-radius: 8px;
    min-width: 340px;
    max-width: 520px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    overflow: hidden;
  }
  .modal-header {
    background: #F1F5F9;
    padding: 10px 14px;
    font-weight: bold;
    color: var(--text-title);
    border-bottom: 1px solid #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body {
    padding: 18px 16px;
    color: var(--text-main);
    font-size: 10pt;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .modal-footer {
    padding: 10px 16px;
    background: #F8FAFC;
    border-top: 1px solid #E2E8F0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>
<div id="app-wrapper">
  <!-- Window Header -->
  <div id="window-header">
    <div class="title-left">
      <span>실사용매칭시험 데이터 Analyzer V2.0 ⚡ (Authored by JH Lee)</span>
    </div>
    <span class="status-badge" id="header-status">Web Edition</span>
  </div>

  <!-- Main Workspace -->
  <div id="main-container">
    <!-- Left Panel -->
    <div id="left-panel">
      <input type="file" id="csv-file-input" accept=".csv,.xlsx,.xls,.txt" style="display:none" />
      <button type="button" class="btn" id="btn-load-csv">📂 csv 파일 로딩</button>
      <div class="lbl" id="lbl-file">선택된 파일: 없음</div>

      <!-- x축 데이터 선택 -->
      <div class="group-box" id="grp-x">
        <span class="group-title">x축 데이터 선택</span>
        <ul class="list-widget" id="x-list" role="listbox" aria-label="x축 데이터 선택"></ul>
      </div>

      <!-- y축 데이터 선택 - 다중 선택 가능 -->
      <div class="group-box" id="grp-y">
        <span class="group-title">y축 데이터 선택 - 다중 선택 가능</span>
        <ul class="list-widget" id="y-list" role="listbox" aria-multiselectable="true" aria-label="y축 데이터 선택"></ul>
        <button type="button" class="btn" id="btn-select-data">⬇ 데이터 선택</button>
      </div>

      <!-- y축 선택 데이터 -->
      <div class="group-box" id="grp-selected-y">
        <span class="group-title">y축 선택 데이터</span>
        <ul class="list-widget" id="selected-y-list" role="listbox" aria-multiselectable="true" aria-label="y축 선택 데이터"></ul>
        <button type="button" class="btn" id="btn-remove-data">❌ 제거</button>
      </div>

      <button type="button" class="btn" id="btn-plot">📈 그래프 출력</button>

      <button type="button" class="btn btn-exit" id="btn-exit">❌ 종료</button>
    </div>

    <!-- Horizontal Splitter -->
    <div class="splitter-h" id="splitter-h" title="좌우 크기 조절"></div>

    <!-- Right Panel -->
    <div id="right-panel">
      <!-- Top Graph Panel -->
      <div id="graph-panel">
        <!-- Navigation Toolbar -->
        <div id="mpl-toolbar">
          <button type="button" class="tool-btn" id="tool-home" title="원래 뷰로 복원 (Home)">🏠 초기화</button>
          <button type="button" class="tool-btn" id="tool-back" title="이전 뷰 (Back)">⬅ 이전</button>
          <button type="button" class="tool-btn" id="tool-forward" title="다음 뷰 (Forward)">➡ 다음</button>
          <div class="tool-sep"></div>
          <button type="button" class="tool-btn" id="tool-pan" title="마우스 드래그로 이동 (Pan)">✋ 이동</button>
          <button type="button" class="tool-btn" id="tool-zoom" title="마우스 드래그로 영역 확대 (Zoom)">🔍 영역확대</button>
          <div class="tool-sep"></div>
          <button type="button" class="tool-btn" id="tool-save" title="그래프 이미지 저장">💾 이미지저장</button>
          <span id="toolbar-coords"></span>
        </div>

        <!-- Graph Canvas -->
        <div id="canvas-container">
          <canvas id="plot-canvas"></canvas>
        </div>

        <!-- 그래프 확대 범위 및 저장 -->
        <div class="group-box" id="graph-control-group">
          <span class="group-title">그래프 확대 범위 및 저장</span>
          <div class="control-grid">
            <!-- Row 0 -->
            <label class="lbl" for="edit-x-min">x축 최소값</label>
            <input type="text" class="line-edit" id="edit-x-min" placeholder="예: 00:00 / 08-10 07:43 / 2026-08-10 07:43" />
            <label class="lbl" for="edit-x-max">x축 최대값</label>
            <input type="text" class="line-edit" id="edit-x-max" placeholder="예: 01:00 / 08-10 08:43 / 2026-08-10 08:43" />
            <button type="button" class="btn" id="btn-apply-x">x축 선택</button>

            <!-- Row 1 -->
            <label class="lbl" for="edit-y-min">y축 최소값</label>
            <input type="text" class="line-edit" id="edit-y-min" />
            <label class="lbl" for="edit-y-max">y축 최대값</label>
            <input type="text" class="line-edit" id="edit-y-max" />
            <button type="button" class="btn" id="btn-apply-y">y축 선택</button>

            <!-- Row 2 -->
            <div></div>
            <div></div>
            <div></div>
            <button type="button" class="btn" id="btn-save-csv" style="justify-self: end; width: 100%;">💾 CSV 파일 저장</button>
            <button type="button" class="btn" id="btn-save-jpg">🖼 그래프(jpg) 저장</button>
          </div>
        </div>
      </div>

      <!-- Vertical Splitter -->
      <div class="splitter-v" id="splitter-v" title="상하 크기 조절"></div>

      <!-- Bottom Analysis Panel -->
      <div id="analysis-panel">
        <div class="group-box" id="analysis-group">
          <span class="group-title">데이터 분석 출력</span>
          <textarea id="analysis-text" readonly spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading Progress Overlay -->
<div id="loading-overlay">
  <div class="loading-box">
    <div class="loading-title" id="loading-title">CSV 파일 로딩 중...</div>
    <div class="progress-bar-bg">
      <div id="progress-bar-fill"></div>
    </div>
    <div id="loading-status">데이터를 읽고 있습니다...</div>
  </div>
</div>

<!-- Message Box Modal -->
<div id="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-title">알림</span>
    </div>
    <div class="modal-body" id="modal-message"></div>
    <div class="modal-footer">
      <button type="button" class="btn" id="modal-ok-btn">확인</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ==============================================================================================
  // Application State (Mirrors CompVibOverallGraphGUI in 01_Matching_Test_Graph_Analyzer_1.py)
  // ==============================================================================================
  const COLOR_CYCLE = [
    "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
    "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf",
    "#003f5c", "#58508d", "#bc5090", "#ff6361", "#ffa600",
    "#006d77", "#83c5be", "#3a86ff", "#8338ec", "#fb5607"
  ];

  const state = {
    fileName: null,
    rowCount: 0,
    timeStrings: null,       // Array<string> of length rowCount
    timeMs: null,            // Float64Array of length rowCount (epoch ms in local time components)
    hasYearOver1900: false,
    minTimeMs: NaN,
    maxTimeMs: NaN,
    refYear: 2026,
    zeroColumns: [],
    nonzeroColumns: [],
    columnData: new Map(),   // Map<colName, Float64Array>
    currentXCol: "Time",
    currentYCols: [],
    currentPlotIndices: null, // Int32Array of row indices matching current filter
    hasActivePlot: false,

    // Interactive Plot State
    plotBounds: null,         // { xMin, xMax, yMin, yMax }
    initialBounds: null,
    viewHistory: [],
    viewHistoryIdx: -1,
    toolMode: null,           // null | 'pan' | 'zoom'
    isDragging: false,
    dragStart: null,
    dragCurrent: null,
    hoverPoint: null,         // { col, xVal, yVal, screenX, screenY }
    plotArea: null            // { left, top, right, bottom, width, height }
  };

  // DOM Elements
  const elFileInput = document.getElementById("csv-file-input");
  const btnLoadCsv = document.getElementById("btn-load-csv");
  const lblFile = document.getElementById("lbl-file");
  const xList = document.getElementById("x-list");
  const yList = document.getElementById("y-list");
  const selectedYList = document.getElementById("selected-y-list");
  const btnSelectData = document.getElementById("btn-select-data");
  const btnRemoveData = document.getElementById("btn-remove-data");
  const btnPlot = document.getElementById("btn-plot");
  const btnExit = document.getElementById("btn-exit");

  const editXMin = document.getElementById("edit-x-min");
  const editXMax = document.getElementById("edit-x-max");
  const btnApplyX = document.getElementById("btn-apply-x");
  const editYMin = document.getElementById("edit-y-min");
  const editYMax = document.getElementById("edit-y-max");
  const btnApplyY = document.getElementById("btn-apply-y");
  const btnSaveCsv = document.getElementById("btn-save-csv");
  const btnSaveJpg = document.getElementById("btn-save-jpg");

  const analysisText = document.getElementById("analysis-text");
  const canvasContainer = document.getElementById("canvas-container");
  const plotCanvas = document.getElementById("plot-canvas");
  const toolbarCoords = document.getElementById("toolbar-coords");

  const toolHome = document.getElementById("tool-home");
  const toolBack = document.getElementById("tool-back");
  const toolForward = document.getElementById("tool-forward");
  const toolPan = document.getElementById("tool-pan");
  const toolZoom = document.getElementById("tool-zoom");
  const toolSave = document.getElementById("tool-save");

  const loadingOverlay = document.getElementById("loading-overlay");
  const loadingTitle = document.getElementById("loading-title");
  const progressBarFill = document.getElementById("progress-bar-fill");
  const loadingStatus = document.getElementById("loading-status");

  const modalOverlay = document.getElementById("modal-overlay");
  const modalTitle = document.getElementById("modal-title");
  const modalMessage = document.getElementById("modal-message");
  const modalOkBtn = document.getElementById("modal-ok-btn");

  // ==============================================================================================
  // Modal Dialog & Progress Helpers
  // ==============================================================================================
  function showMessage(title, message) {
    modalTitle.textContent = title;
    modalMessage.textContent = message;
    modalOverlay.style.display = "flex";
    modalOkBtn.focus();
  }

  modalOkBtn.addEventListener("click", () => {
    modalOverlay.style.display = "none";
  });

  window.addEventListener("keydown", (e) => {
    if (modalOverlay.style.display === "flex" && (e.key === "Enter" || e.key === "Escape")) {
      modalOverlay.style.display = "none";
    }
  });

  function showLoading(title, statusText, percent) {
    loadingOverlay.style.display = "flex";
    loadingTitle.textContent = title;
    loadingStatus.textContent = statusText;
    progressBarFill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
  }

  function hideLoading() {
    loadingOverlay.style.display = "none";
  }

  function nextFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));
  }

  // ==============================================================================================
  // Splitters (Resizable Left/Right & Top/Bottom Panels)
  // ==============================================================================================
  const splitterH = document.getElementById("splitter-h");
  const leftPanel = document.getElementById("left-panel");
  const splitterV = document.getElementById("splitter-v");
  const rightPanel = document.getElementById("right-panel");
  const graphPanel = document.getElementById("graph-panel");
  const analysisPanel = document.getElementById("analysis-panel");

  let activeSplitter = null;

  splitterH.addEventListener("mousedown", (e) => {
    e.preventDefault();
    activeSplitter = "h";
    splitterH.classList.add("active");
  });

  splitterV.addEventListener("mousedown", (e) => {
    e.preventDefault();
    activeSplitter = "v";
    splitterV.classList.add("active");
  });

  window.addEventListener("mousemove", (e) => {
    if (!activeSplitter) return;
    if (activeSplitter === "h") {
      const newWidth = Math.max(260, Math.min(650, e.clientX - 8));
      leftPanel.style.width = `${newWidth}px`;

    } else if (activeSplitter === "v") {
      const rect = rightPanel.getBoundingClientRect();

      const totalH = rect.height;

      graphPanel.style.flex = `${Math.round(topRatio * 100)}`;
      analysisPanel.style.flex = `${Math.round((1 - topRatio) * 100)}`;

      splitterH.classList.remove("active");
      splitterV.classList.remove("active");

    }

  // ==============================================================================================
  // Date / Time Parsing & Formatting Utilities
  // We store timestamps as UTC-epoch milliseconds corresponding to local calendar fields
  // (Date.UTC(year, month-1, day, hour, minute, second, ms)) so timezone offsets/DST never shift hours.
  // ==============================================================================================
  function makeTimestampMs(year, month, day, hour = 0, minute = 0, second = 0, ms = 0) {
    const dt = new Date(Date.UTC(year, month - 1, day, hour, minute, second, ms));
    if (
      dt.getUTCFullYear() !== year ||
      dt.getUTCMonth() !== month - 1 ||
      dt.getUTCDate() !== day
    ) {
      return NaN;
    }
    return dt.getTime();
  }

  function extractTimeParts(ms) {
    const d = new Date(ms);
    return {
      year: d.getUTCFullYear(),
      month: d.getUTCMonth() + 1,
      day: d.getUTCDate(),
      hour: d.getUTCHours(),
      minute: d.getUTCMinutes(),
      second: d.getUTCSeconds(),
      millis: d.getUTCMilliseconds()
    };
  }

  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function pad3(n) {
    if (n < 10) return "00" + n;
    if (n < 100) return "0" + n;
    return "" + n;
  }

  function formatTimeForAnalysis(ms) {
    if (!Number.isFinite(ms)) return "-";
    const p = extractTimeParts(ms);
    if (p.year > 1900) {
      return `${pad2(p.month)}-${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}.${pad3(p.millis)}`;
    }
    return `${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}.${pad3(p.millis)}`;
  }

  function formatTimeForAxis(ms, hasYearOver1900) {
    if (!Number.isFinite(ms)) return "";
    const p = extractTimeParts(ms);
    if (hasYearOver1900 || p.year > 1900) {
      return `${pad2(p.month)}-${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}`;
    }
    return `${pad2(p.hour)}:${pad2(p.minute)}`;
  }

  function formatTimeForHover(ms) {
    if (!Number.isFinite(ms)) return "";
    const p = extractTimeParts(ms);
    return `${pad2(p.month)}-${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}`;
  }

  function formatTimeForCsvSave(ms) {
    if (!Number.isFinite(ms)) return "";
    const p = extractTimeParts(ms);
    return `${p.year}-${pad2(p.month)}-${pad2(p.day)} ${pad2(p.hour)}:${pad2(p.minute)}:${pad2(p.second)}.${pad3(p.millis)}`;
  }

  /**
   * Fast and comprehensive time string parser for CSV rows and user input bounds.
   * Supports:
   * - "YYYY-MM-DD HH:MM:SS.fff", "YYYY-MM-DD HH:MM:SS", "YYYY-MM-DD HH:MM"
   * - "YYYY-MM-DD hh:mm:ss AM/PM", "YYYY-MM-DD 오전/오후 hh:mm"
   * - "YYYY년 MM월 DD일 오전/오후 hh시 mm분"
   * - "MM-DD HH:MM:SS", "MM-DD HH:MM" (uses defaultYear if provided)
   * - "HH:MM:SS.fff", "HH:MM:SS", "HH:MM" (uses defaultDateParts if provided)
   */
  const RE_FULL_DATETIME = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\s+(?:(오전|오후|AM|PM|am|pm)\s+)?(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?(?:\s*(AM|PM|am|pm|오전|오후))?$/;
  const RE_KR_DATETIME = /^(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:(오전|오후|AM|PM|am|pm)\s*)?(\d{1,2})\s*(?:시|:)\s*(\d{1,2})\s*(?:분)?(?:\s*(\d{1,2})\s*초?)?$/;
  const RE_NO_YEAR_DATETIME = /^(\d{1,2})[-/.](\d{1,2})\s+(?:(오전|오후|AM|PM|am|pm)\s+)?(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?(?:\s*(AM|PM|am|pm|오전|오후))?$/;
  const RE_COMPACT_DATETIME = /^(?:(\d{4}))?(\d{2})(\d{2})\s+(\d{2}):?(\d{2})(?::?(\d{2}))?$/;
  const RE_TIME_ONLY = /^(?:(오전|오후|AM|PM|am|pm)\s+)?(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?(?:\s*(AM|PM|am|pm|오전|오후))?$/;
  const RE_DATE_ONLY = /^(?:(\d{4})[-/.])?(\d{1,2})[-/.](\d{1,2})$/;

  function adjustAmPm(hour, ampm) {
    if (!ampm) return hour;
    const upper = ampm.toUpperCase();
    const isPm = upper === "PM" || upper === "오후";
    const isAm = upper === "AM" || upper === "오전";
    if (isPm && hour < 12) return hour + 12;
    if (isAm && hour === 12) return 0;
    return hour;
  }

  function parseMillisFraction(fracStr) {
    if (!fracStr) return 0;
    if (fracStr.length === 1) return parseInt(fracStr, 10) * 100;
    if (fracStr.length === 2) return parseInt(fracStr, 10) * 10;
    return parseInt(fracStr.slice(0, 3), 10);
  }

  function parseSingleTimeValue(rawStr, defaultYear = 1900, defaultMonth = 1, defaultDay = 1) {
    if (!rawStr) return NaN;
    let s = String(rawStr).trim();
    if (s.includes("'")) s = s.replace(/'/g, "");
    s = s.replace(/\s+/g, " ").trim();
    if (!s) return NaN;

    // 1. Full YYYY-MM-DD HH:MM[:SS[.fff]] [AM/PM]
    let m = RE_FULL_DATETIME.exec(s);
    if (m) {
      const year = parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const ampm = m[4] || m[9];
      const hour = adjustAmPm(parseInt(m[5], 10), ampm);
      const minute = parseInt(m[6], 10);
      const second = m[7] ? parseInt(m[7], 10) : 0;
      const ms = parseMillisFraction(m[8]);
      return makeTimestampMs(year, month, day, hour, minute, second, ms);
    }

    // 2. MM-DD HH:MM[:SS[.fff]] (without year)
    m = RE_NO_YEAR_DATETIME.exec(s);
    if (m) {
      const year = defaultYear > 1900 ? defaultYear : 2026;
      const month = parseInt(m[1], 10);
      const day = parseInt(m[2], 10);
      const ampm = m[3] || m[8];
      const hour = adjustAmPm(parseInt(m[4], 10), ampm);
      const minute = parseInt(m[5], 10);
      const second = m[6] ? parseInt(m[6], 10) : 0;
      const ms = parseMillisFraction(m[7]);
      return makeTimestampMs(year, month, day, hour, minute, second, ms);
    }

    // 3. Korean format: [YYYY년] MM월 DD일 [오전/오후] HH시 MM분
    m = RE_KR_DATETIME.exec(s);
    if (m) {
      const year = m[1] ? parseInt(m[1], 10) : (defaultYear > 1900 ? defaultYear : 2026);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const hour = adjustAmPm(parseInt(m[5], 10), m[4]);
      const minute = parseInt(m[6], 10);
      const second = m[7] ? parseInt(m[7], 10) : 0;
      return makeTimestampMs(year, month, day, hour, minute, second, 0);
    }

    // 3b. Compact format: [YYYY]MMDD HH[:]MM[:SS]
    m = RE_COMPACT_DATETIME.exec(s);
    if (m) {
      const year = m[1] ? parseInt(m[1], 10) : (defaultYear > 1900 ? defaultYear : 2026);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      const hour = parseInt(m[4], 10);
      const minute = parseInt(m[5], 10);
      const second = m[6] ? parseInt(m[6], 10) : 0;
      return makeTimestampMs(year, month, day, hour, minute, second, 0);
    }

    // 4. Time only: HH:MM[:SS[.fff]]
    m = RE_TIME_ONLY.exec(s);
    if (m) {
      const ampm = m[1] || m[6];
      const hour = adjustAmPm(parseInt(m[2], 10), ampm);
      const minute = parseInt(m[3], 10);
      const second = m[4] ? parseInt(m[4], 10) : 0;
      const ms = parseMillisFraction(m[5]);
      return makeTimestampMs(defaultYear, defaultMonth, defaultDay, hour, minute, second, ms);
    }

    // 5. Date only: [YYYY-]MM-DD
    m = RE_DATE_ONLY.exec(s);
    if (m) {
      const year = m[1] ? parseInt(m[1], 10) : (defaultYear > 1900 ? defaultYear : 2026);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      return makeTimestampMs(year, month, day, 0, 0, 0, 0);
    }

    return NaN;
  }

  function parseTimeBound(text, isMax = false) {
    let rawText = String(text || "").trim().replace(/'/g, "");
    rawText = rawText.replace(/\s+/g, " ").trim();
    if (!rawText) return NaN;

    const refMs = isMax ? state.maxTimeMs : state.minTimeMs;
    let refYear = state.refYear || 2026;
    let refMonth = 1;
    let refDay = 1;

    if (Number.isFinite(refMs)) {
      const p = extractTimeParts(refMs);
      refYear = p.year;
      refMonth = p.month;
      refDay = p.day;
    }

    const parsed = parseSingleTimeValue(rawText, refYear, refMonth, refDay);
    if (!Number.isFinite(parsed)) {
      throw new Error(`x축 시간 범위를 해석할 수 없습니다: ${rawText}`);
    }
    return parsed;
  }

  // ==============================================================================================
  // CSV Line Splitting Helper
  // ==============================================================================================
  function splitCsvLine(line) {
    // Fast path when no quotes exist in the line
    if (line.indexOf('"') === -1) {
      return line.split(",");
    }
    const result = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === "," && !inQuotes) {
        result.push(current);
        current = "";
      } else {
        current += ch;
      }
    }
    result.push(current);
    return result;
  }

  function standardizeColumns(rawCols) {
    const columns = [];
    const seen = Object.create(null);
    for (let i = 0; i < rawCols.length; i++) {
      let c = String(rawCols[i] ?? "").trim().replace(/'/g, "");
      if (c === "" || c.toLowerCase().startsWith("unnamed")) {
        c = i === 0 ? "Time" : `CH${i}`;
      }
      if (Object.prototype.hasOwnProperty.call(seen, c)) {
        seen[c] += 1;
        c = `${c}_${seen[c]}`;
      } else {
        seen[c] = 0;
      }
      columns.push(c);
    }
    if (!columns.includes("Time") && columns.length > 0) {
      columns[0] = "Time";
    }
    return columns;
  }

  // ==============================================================================================
  // CSV File Loading (Handles 115MB+ W1/W3 CSV files & UTF-8/CP949 Auto-Detection)
  // ==============================================================================================
  btnLoadCsv.addEventListener("click", () => {
    elFileInput.value = "";
    elFileInput.click();
  });

  elFileInput.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    await handleFileLoad(file);
  });

  // Also support drag-and-drop onto the window
  window.addEventListener("dragover", (e) => {
    e.preventDefault();
  });
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    await handleFileLoad(file);
  });

  async function isExcelOrNonCsvFile(file) {
    const name = (file.name || "").toLowerCase();
    if (name.endsWith(".xlsx") || name.endsWith(".xls") || name.endsWith(".xlsm") || name.endsWith(".xlsb")) {
      return true;
    }
    try {
      const headerBuf = await file.slice(0, 8).arrayBuffer();
      const bytes = new Uint8Array(headerBuf);
      // ZIP header (PK\x03\x04) used by .xlsx or OLE2 header (\xD0\xCF\x11\xE0) used by .xls
      if (
        (bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04) ||
        (bytes.length >= 4 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0)
      ) {
        return true;
      }
    } catch (_) {
      // Ignore slice error
    }
    if (!name.endsWith(".csv")) {
      return true;
    }
    return false;
  }

  async function detectEncoding(file) {
    const sampleSize = Math.min(file.size, 65536);
    const buf = await file.slice(0, sampleSize).arrayBuffer();
    const bytes = new Uint8Array(buf);
    try {
      // Strip potential incomplete multibyte sequence at the very end of the 64KB sample
      let checkLen = bytes.length;
      if (sampleSize < file.size) {
        while (checkLen > 0 && (bytes[checkLen - 1] & 0x80) !== 0) {
          checkLen--;
        }
      }
      new TextDecoder("utf-8", { fatal: true }).decode(bytes.subarray(0, checkLen));
      return "utf-8";
    } catch (_) {
      return "euc-kr"; // WhatWG standard label covering CP949 & EUC-KR
    }
  }

  async function countNewlines(file) {
    const CHUNK_SIZE = 16 * 1024 * 1024;
    let count = 0;
    let offset = 0;
    let lastByte = 0;
    while (offset < file.size) {
      const slice = file.slice(offset, Math.min(file.size, offset + CHUNK_SIZE));
      const buf = await slice.arrayBuffer();
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) {
        if (bytes[i] === 10) count++;
      }
      if (bytes.length > 0) {
        lastByte = bytes[bytes.length - 1];
      }
      offset += CHUNK_SIZE;
    }
    if (file.size > 0 && lastByte !== 10) {
      count++;
    }
    return count;
  }

  async function handleFileLoad(file) {
    // Constraint check: Excel file or non-CSV file check
    if (await isExcelOrNonCsvFile(file)) {
      showMessage("파일 형식 오류", "csv 파일로 데이터 로드 바랍니다");
      return;
    }

    try {
      showLoading("CSV 파일 로딩 중...", "파일 인코딩 및 행 수를 확인하고 있습니다...", 5);
      await nextFrame();

      const encoding = await detectEncoding(file);
      const estimatedLines = await countNewlines(file);

      if (estimatedLines === 0) {
        hideLoading();
        throw new Error("데이터 파일에 데이터가 없습니다.");
      }

      showLoading("CSV 파일 로딩 중...", "헤더 및 컬럼 구조를 분석하고 있습니다...", 12);
      await nextFrame();

      // Read first 64KB to inspect first 2 lines for header structure
      const headBuf = await file.slice(0, Math.min(file.size, 65536)).arrayBuffer();
      const headText = new TextDecoder(encoding).decode(new Uint8Array(headBuf)).replace(/^\uFEFF/, "");
      const previewLines = headText.split(/\r?\n/).filter((l) => l.trim().length > 0);
      if (previewLines.length === 0) {
        hideLoading();
        throw new Error("데이터 파일에 데이터가 없습니다.");
      }

      const row0Cells = splitCsvLine(previewLines[0]);
      const row1Cells = previewLines.length >= 2 ? splitCsvLine(previewLines[1]) : [];
      const firstCell = String(row0Cells[0] ?? "").trim().replace(/'/g, "");
      const secondCell = row1Cells.length > 0 ? String(row1Cells[0] ?? "").trim().replace(/'/g, "") : "";

      let rawHeaders = [];
      let dataStartLineIdx = 0;

      // 1) W1/W3 two-row header: Row 0 starts with CODE, Row 1 starts with TIME
      if (firstCell.toUpperCase().startsWith("CODE") && secondCell.toUpperCase().startsWith("TIME")) {
        rawHeaders = row1Cells;
        dataStartLineIdx = 2;
      }
      // 2) Standard header: Row 0 starts with Time/TIME
      else if (firstCell.toLowerCase() === "time") {
        rawHeaders = row0Cells;
        dataStartLineIdx = 1;
      }
      // 3) Check if any subsequent header starts with CH
      else {
        const hasChHeader = row0Cells.slice(1).some((c) => String(c).trim().toUpperCase().startsWith("CH"));
        if (hasChHeader) {
          rawHeaders = row0Cells;
          dataStartLineIdx = 1;
        } else {
          // No header: first column is Time, others CH1, CH2, ...
          rawHeaders = ["Time"];
          for (let i = 1; i < row0Cells.length; i++) {
            rawHeaders.push(`CH${i}`);
          }
          dataStartLineIdx = 0;
        }
      }

      const columns = standardizeColumns(rawHeaders);
      const numCols = columns.length;
      const timeColIdx = columns.indexOf("Time");
      const maxDataRows = Math.max(1, estimatedLines - dataStartLineIdx + 2);

      // Allocate columnar buffers
      const timeStrings = new Array(maxDataRows);
      const timeMs = new Float64Array(maxDataRows);
      const colArrays = new Array(numCols);
      const validCounts = new Int32Array(numCols);
      const firstVals = new Float64Array(numCols);
      const isNonConstant = new Uint8Array(numCols);
      firstVals.fill(NaN);

      for (let j = 0; j < numCols; j++) {
        if (j !== timeColIdx) {
          colArrays[j] = new Float64Array(maxDataRows);
          colArrays[j].fill(NaN);
        }
      }

      // Stream-parse file in chunks
      const CHUNK_SIZE = 12 * 1024 * 1024;
      const decoder = new TextDecoder(encoding);
      let offset = 0;
      let leftover = "";
      let lineIndex = 0;
      let rowIdx = 0;
      let badTimeSamples = [];
      let isSorted = true;
      let prevTimeMs = -Infinity;

      while (offset < file.size) {
        const end = Math.min(file.size, offset + CHUNK_SIZE);
        const buf = await file.slice(offset, end).arrayBuffer();
        const isLastChunk = end >= file.size;
        let chunkStr = decoder.decode(new Uint8Array(buf), { stream: !isLastChunk });
        if (offset === 0 && chunkStr.charCodeAt(0) === 0xFEFF) {
          chunkStr = chunkStr.slice(1);
        }

        const combined = leftover + chunkStr;
        let startPos = 0;
        const len = combined.length;

        for (let pos = 0; pos < len; pos++) {
          if (combined.charCodeAt(pos) === 10) {
            let lineEnd = pos;
            if (lineEnd > startPos && combined.charCodeAt(lineEnd - 1) === 13) {
              lineEnd--;
            }
            const line = combined.slice(startPos, lineEnd);
            startPos = pos + 1;

            if (line.trim().length === 0) continue;

            if (lineIndex >= dataStartLineIdx) {
              processDataLine(
                line,
                rowIdx,
                numCols,
                timeColIdx,
                timeStrings,
                timeMs,
                colArrays,
                validCounts,
                firstVals,
                isNonConstant,
                badTimeSamples
              );
              const tVal = timeMs[rowIdx];
              if (tVal < prevTimeMs) {
                isSorted = false;
              }
              prevTimeMs = tVal;
              rowIdx++;
            }
            lineIndex++;
          }
        }

        leftover = combined.slice(startPos);
        offset = end;

        const pct = 15 + Math.round((offset / file.size) * 70);
        showLoading(
          "CSV 파일 로딩 중...",
          `데이터 파싱 중... (${rowIdx.toLocaleString()} 행 처리됨)`,
          pct
        );
        await nextFrame();
      }

      if (leftover.trim().length > 0) {
        if (lineIndex >= dataStartLineIdx) {
          processDataLine(
            leftover.trim(),
            rowIdx,
            numCols,
            timeColIdx,
            timeStrings,
            timeMs,
            colArrays,
            validCounts,
            firstVals,
            isNonConstant,
            badTimeSamples
          );
          if (timeMs[rowIdx] < prevTimeMs) isSorted = false;
          rowIdx++;
        }
      }

      if (rowIdx === 0) {
        hideLoading();
        throw new Error("데이터 파일에 유효한 데이터 행이 없습니다.");
      }

      if (badTimeSamples.length > 0) {
        hideLoading();
        throw new Error(
          "Time 컬럼의 일부 값을 시간 형식으로 변환하지 못했습니다. 예: " +
          badTimeSamples.slice(0, 5).join(", ")
        );
      }

      showLoading("CSV 파일 로딩 중...", "상수 컬럼 필터링 및 시간 정렬 중...", 90);
      await nextFrame();

      const actualRowCount = rowIdx;
      const zeroCols = [];
      const nonzeroCols = [];
      const newColumnData = new Map();

      for (let j = 0; j < numCols; j++) {
        if (j === timeColIdx) continue;
        const colName = columns[j];
        if (validCounts[j] === 0 || isNonConstant[j] === 0) {
          zeroCols.push(colName);
          colArrays[j] = null; // Free memory for constant columns immediately
        } else {
          nonzeroCols.push(colName);
          newColumnData.set(colName, colArrays[j].subarray(0, actualRowCount));
        }
      }

      let finalTimeStrings = timeStrings.slice(0, actualRowCount);
      let finalTimeMs = timeMs.subarray(0, actualRowCount);

      // Stable sort by Time_dt if needed (matches df.sort_values("Time_dt", kind="mergesort"))
      if (!isSorted) {
        const order = new Int32Array(actualRowCount);
        for (let i = 0; i < actualRowCount; i++) order[i] = i;
        order.sort((a, b) => {
          const diff = finalTimeMs[a] - finalTimeMs[b];
          return diff !== 0 ? diff : a - b;
        });

        const sortedStrings = new Array(actualRowCount);
        const sortedMs = new Float64Array(actualRowCount);
        for (let i = 0; i < actualRowCount; i++) {
          const idx = order[i];
          sortedStrings[i] = finalTimeStrings[idx];
          sortedMs[i] = finalTimeMs[idx];
        }
        finalTimeStrings = sortedStrings;
        finalTimeMs = sortedMs;

        for (const [colName, arr] of newColumnData.entries()) {
          const sortedCol = new Float64Array(actualRowCount);
          for (let i = 0; i < actualRowCount; i++) {
            sortedCol[i] = arr[order[i]];
          }
          newColumnData.set(colName, sortedCol);
        }
      }

      // Compute time metadata
      let minMs = Infinity;
      let maxMs = -Infinity;
      let hasYearOver1900 = false;
      for (let i = 0; i < actualRowCount; i++) {
        const v = finalTimeMs[i];
        if (v < minMs) minMs = v;
        if (v > maxMs) maxMs = v;
      }
      const minParts = extractTimeParts(minMs);
      if (minParts.year > 1900 || extractTimeParts(maxMs).year > 1900) {
        hasYearOver1900 = true;
      }

      // Commit state
      state.fileName = file.name;
      state.rowCount = actualRowCount;
      state.timeStrings = finalTimeStrings;
      state.timeMs = finalTimeMs;
      state.minTimeMs = minMs;
      state.maxTimeMs = maxMs;
      state.hasYearOver1900 = hasYearOver1900;
      state.refYear = minParts.year > 1900 ? minParts.year : 2026;
      state.zeroColumns = zeroCols;
      state.nonzeroColumns = nonzeroCols;
      state.columnData = newColumnData;
      state.currentXCol = "Time";
      state.currentYCols = [];
      state.currentPlotIndices = null;
      state.hasActivePlot = false;
      state.hoverPoint = null;

      selectedYList.innerHTML = "";
      lblFile.textContent = `선택된 파일: ${state.fileName}`;
      document.getElementById("header-status").textContent = `${state.fileName} (${actualRowCount.toLocaleString()} 행)`;

      populateColumnLists();
      updateFileInformationOnly();
      drawEmptyGraph();
      hideLoading();
    } catch (err) {
      hideLoading();
      showMessage("CSV 로딩 오류", `CSV 파일 로딩 중 오류가 발생했습니다.\n\n${err.message || err}`);
    }
  }

  function processDataLine(
    line,
    rowIdx,
    numCols,
    timeColIdx,
    timeStrings,
    timeMs,
    colArrays,
    validCounts,
    firstVals,
    isNonConstant,
    badTimeSamples
  ) {
    // Fast manual comma scanning for high performance on 100k+ rows x 378 columns
    const hasQuote = line.indexOf('"') !== -1;
    if (hasQuote) {
      const cells = splitCsvLine(line);
      const rawTime = String(cells[timeColIdx] ?? "").trim().replace(/'/g, "");
      timeStrings[rowIdx] = rawTime;
      const tVal = parseSingleTimeValue(rawTime);
      timeMs[rowIdx] = tVal;
      if (Number.isNaN(tVal) && badTimeSamples.length < 5) {
        badTimeSamples.push(rawTime);
      }

      const limit = Math.min(numCols, cells.length);
      for (let j = 0; j < limit; j++) {
        if (j === timeColIdx) continue;
        const cellStr = cells[j];
        if (!cellStr) continue;
        const v = Number(cellStr);
        if (!Number.isNaN(v)) {
          colArrays[j][rowIdx] = v;
          const cnt = validCounts[j];
          if (cnt === 0) {
            firstVals[j] = v;
          } else if (isNonConstant[j] === 0 && v !== firstVals[j]) {
            isNonConstant[j] = 1;
          }
          validCounts[j] = cnt + 1;
        }
      }
      return;
    }

    let colIdx = 0;
    let start = 0;
    const len = line.length;
    while (colIdx < numCols && start <= len) {
      let commaPos = line.indexOf(",", start);
      if (commaPos === -1) commaPos = len;
      const token = line.slice(start, commaPos);
      start = commaPos + 1;

      if (colIdx === timeColIdx) {
        const rawTime = token.trim().replace(/'/g, "");
        timeStrings[rowIdx] = rawTime;
        const tVal = parseSingleTimeValue(rawTime);
        timeMs[rowIdx] = tVal;
        if (Number.isNaN(tVal) && badTimeSamples.length < 5) {
          badTimeSamples.push(rawTime);
        }
      } else if (token.length > 0) {
        const v = +token;
        if (!Number.isNaN(v)) {
          colArrays[colIdx][rowIdx] = v;
          const cnt = validCounts[colIdx];
          if (cnt === 0) {
            firstVals[colIdx] = v;
          } else if (isNonConstant[colIdx] === 0 && v !== firstVals[colIdx]) {
            isNonConstant[colIdx] = 1;
          }
          validCounts[colIdx] = cnt + 1;
        }
      }
      colIdx++;
    }
  }

  // ==============================================================================================
  // List Widgets & Selection Logic
  // ==============================================================================================
  function populateColumnLists() {
    xList.innerHTML = "";
    yList.innerHTML = "";

    const xCandidates = ["Time", ...state.nonzeroColumns];
    xCandidates.forEach((col) => {
      const li = document.createElement("li");
      li.textContent = col;

    setupMultiSelectList(yList, (li) => {
      // Double click adds directly to selected_y_list
      addToSelectedY([li.dataset.col]);
    });

    state.nonzeroColumns.forEach((col) => {
      const li = document.createElement("li");
      li.textContent = col;
      li.dataset.col = col;
      yList.appendChild(li);
    });
  }

  /**
   * Configures a <ul> element to support intuitive multi-selection:
   * - Clicking an item toggles its selection (so users can click multiple items with or without Ctrl)
   * - Shift+Click selects a range of items
   * - Double-clicking triggers optional callback
   */
  function setupMultiSelectList(ulElement, onDoubleClickItem) {
    let lastClickedIndex = -1;

    ulElement.onclick = (e) => {
      const li = e.target.closest("li");
      if (!li || !ulElement.contains(li)) return;
      const items = Array.from(ulElement.children);
      const currentIndex = items.indexOf(li);

      if (e.shiftKey && lastClickedIndex !== -1 && lastClickedIndex < items.length) {
        const start = Math.min(lastClickedIndex, currentIndex);
        const end = Math.max(lastClickedIndex, currentIndex);
        for (let i = start; i <= end; i++) {
          items[i].classList.add("selected");
        }
      } else {
        li.classList.toggle("selected");
        lastClickedIndex = currentIndex;
      }
    };

    if (onDoubleClickItem) {
      ulElement.ondblclick = (e) => {
        const li = e.target.closest("li");
        if (!li || !ulElement.contains(li)) return;
        onDoubleClickItem(li);
      };
    }
  }

  setupMultiSelectList(selectedYList, null);

  function getSelectedYItems() {
    return Array.from(selectedYList.children).map((li) => li.dataset.col);
  }

  function addToSelectedY(colNames) {
    const existing = new Set(getSelectedYItems());
    colNames.forEach((col) => {
      if (!existing.has(col)) {
        existing.add(col);
        const li = document.createElement("li");
        li.textContent = col;
        li.dataset.col = col;
        selectedYList.appendChild(li);
      }
    });
  }

  // ==============================================================================================
  // Analysis Text Output (Matches _make_file_info_text & _update_analysis_text 100%)
  // ==============================================================================================
  function makeFileInfoText() {
    const zeroNames = state.zeroColumns.length > 0 ? state.zeroColumns.join(", ") : "없음";
    const nonzeroNames = state.nonzeroColumns.length > 0 ? state.nonzeroColumns.join(", ") : "없음";

    return (
      "[File Information]\n" +
      `- 선택 CSV 파일 이름: ${state.fileName}\n` +
      `- 총 데이터 행의 갯수: ${state.rowCount.toLocaleString()}\n` +
      `- 모든 값이 동일하여 삭제된 column 갯수: ${state.zeroColumns.length.toLocaleString()}\n` +
      `- 모든 값이 동일하여 삭제된 column name: ${zeroNames}\n` +
      `- 그래프/분석 대상 column 갯수: ${state.nonzeroColumns.length.toLocaleString()}\n` +
      `- 그래프/분석 대상 column name: ${nonzeroNames}\n`
    );
  }

  function updateFileInformationOnly() {
    if (!state.fileName) return;
    analysisText.value = makeFileInfoText();
  }

  function padRight(str, width) {
    const s = String(str);
    return s.length >= width ? s : s + " ".repeat(width - s.length);
  }

  function padLeft(str, width) {
    const s = String(str);
    return s.length >= width ? s : " ".repeat(width - s.length) + s;
  }

  function updateAnalysisText(indices, xCol, yCols) {
    const lines = [makeFileInfoText(), "", "[Data Analysis]"];
    const n = indices.length;

    if (xCol === "Time") {
      let minT = Infinity;
      let maxT = -Infinity;
      for (let i = 0; i < n; i++) {
        const t = state.timeMs[indices[i]];
        if (t < minT) minT = t;
        if (t > maxT) maxT = t;
      }
      const xMinStr = formatTimeForAnalysis(minT);
      const xMaxStr = formatTimeForAnalysis(maxT);
      lines.push(`- 분석 x축 범위: ${xMinStr} ~ ${xMaxStr}`);
    } else {
      const xArr = state.columnData.get(xCol);
      let minX = Infinity;
      let maxX = -Infinity;
      for (let i = 0; i < n; i++) {
        const v = xArr[indices[i]];
        if (!Number.isNaN(v)) {
          if (v < minX) minX = v;
          if (v > maxX) maxX = v;
        }
      }
      lines.push(`- 분석 x축 column: ${xCol}`);
      lines.push(`- 분석 x축 범위: ${minX} ~ ${maxX}`);
    }

    lines.push(`- 선택 y축 column 갯수: ${yCols.length.toLocaleString()}`);
    lines.push("");
    lines.push(
      padRight("Column", 22) +
      padLeft("Count", 10) +
      padLeft("Mean", 14) +
      padLeft("Max", 14) +
      padLeft("Max Time", 18) +
      padLeft("Min", 14) +
      padLeft("Min Time", 18) +
      padLeft("Std", 14) +
      padLeft("RMS", 14) +
      padLeft("Range", 14) +
      padLeft("Peak-Peak", 14)
    );
    lines.push("-".repeat(166));

    for (const col of yCols) {
      const arr = state.columnData.get(col);
      if (!arr) continue;

      let countV = 0;
      let sum = 0;
      let sumSq = 0;
      let maxV = -Infinity;
      let minV = Infinity;
      let maxRowIdx = -1;
      let minRowIdx = -1;

      for (let i = 0; i < n; i++) {
        const rIdx = indices[i];
        const v = arr[rIdx];
        if (!Number.isNaN(v)) {
          countV++;
          sum += v;
          sumSq += v * v;
          if (v > maxV) {
            maxV = v;
            maxRowIdx = rIdx;
          }
          if (v < minV) {
            minV = v;
            minRowIdx = rIdx;
          }
        }
      }

      if (countV === 0) continue;

      const meanV = sum / countV;
      // Two-pass sample standard deviation (ddof=1) for numerical precision matching pandas std(ddof=1)
      let sumDiffSq = 0;
      if (countV > 1) {
        for (let i = 0; i < n; i++) {
          const v = arr[indices[i]];
          if (!Number.isNaN(v)) {
            const d = v - meanV;
            sumDiffSq += d * d;
          }
        }
      }
      const stdV = countV > 1 ? Math.sqrt(sumDiffSq / (countV - 1)) : 0.0;
      const rmsV = Math.sqrt(sumSq / countV);
      const rangeV = maxV - minV;
      const peakToPeakV = rangeV;

      let maxTime = "-";
      let minTime = "-";
      if (xCol === "Time") {
        maxTime = formatTimeForAnalysis(state.timeMs[maxRowIdx]);
        minTime = formatTimeForAnalysis(state.timeMs[minRowIdx]);
      }

      lines.push(
        padRight(col, 22) +
        padLeft(countV.toLocaleString("en-US"), 10) +
        padLeft(meanV.toFixed(4), 14) +
        padLeft(maxV.toFixed(4), 14) +
        padLeft(maxTime, 18) +
        padLeft(minV.toFixed(4), 14) +
        padLeft(minTime, 18) +
        padLeft(stdV.toFixed(4), 14) +
        padLeft(rmsV.toFixed(4), 14) +
        padLeft(rangeV.toFixed(4), 14) +
        padLeft(peakToPeakV.toFixed(4), 14)
      );
    }

    lines.push("");
    lines.push("[Note]");
    lines.push("- Count: numeric data count after removing NaN");
    lines.push("- Std: sample standard deviation, pandas std(ddof=1)");
    lines.push("- RMS: Root Mean Square = sqrt(mean(x^2))");
    lines.push("- Range / Peak-Peak: Max - Min");

    analysisText.value = lines.join("\n");
  }

  // ==============================================================================================
  // Filtering & Plotting Logic
  // ==============================================================================================
  function makeFilteredPlotIndices(xCol) {
    const xMinText = editXMin.value.trim();
    const xMaxText = editXMax.value.trim();
    const n = state.rowCount;

    if (xCol === "Time") {
      const hasMin = xMinText.length > 0;
      const hasMax = xMaxText.length > 0;
      const xMinDt = hasMin ? parseTimeBound(xMinText, false) : -Infinity;
      const xMaxDt = hasMax ? parseTimeBound(xMaxText, true) : Infinity;

      const temp = new Int32Array(n);
      let k = 0;
      for (let i = 0; i < n; i++) {
        const t = state.timeMs[i];
        if (t >= xMinDt && t <= xMaxDt) {
          temp[k++] = i;
        }
      }
      return temp.subarray(0, k);
    } else {
      const xArr = state.columnData.get(xCol);
      const hasMin = xMinText.length > 0;
      const hasMax = xMaxText.length > 0;
      const xMinVal = hasMin ? Number(xMinText) : -Infinity;
      const xMaxVal = hasMax ? Number(xMaxText) : Infinity;
      if ((hasMin && Number.isNaN(xMinVal)) || (hasMax && Number.isNaN(xMaxVal))) {
        throw new Error("x축 숫자 범위를 올바르게 입력해 주세요.");
      }

      const temp = new Int32Array(n);
      let k = 0;
      for (let i = 0; i < n; i++) {
        const v = xArr[i];
        if (!Number.isNaN(v) && v >= xMinVal && v <= xMaxVal) {
          temp[k++] = i;
        }
      }
      return temp.subarray(0, k);
    }
  }

  function plotSelectedData() {
    if (!state.fileName || state.rowCount === 0) {
      showMessage("데이터 없음", "먼저 csv/xlsx 파일을 로딩해 주세요.");
      return;
    }

    const xSelectedEl = xList.querySelector("li.selected");
    const yCols = getSelectedYItems();

    if (!xSelectedEl) {
      showMessage("x축 선택 필요", "x축 데이터를 선택해 주세요.");
      return;
    }
    if (yCols.length === 0) {
      showMessage("y축 선택 필요", "그래프로 출력할 y축 데이터를 1개 이상 선택해 주세요.");
      return;
    }

    const xCol = xSelectedEl.dataset.col;
    state.currentXCol = xCol;
    state.currentYCols = yCols;

    try {
      const indices = makeFilteredPlotIndices(xCol);
      if (indices.length === 0) {
        throw new Error("선택한 x축 범위에 해당하는 데이터가 없습니다.");
      }

      // Compute data bounds for plotting
      let xMin = Infinity;
      let xMax = -Infinity;
      const xSource = xCol === "Time" ? state.timeMs : state.columnData.get(xCol);
      for (let i = 0; i < indices.length; i++) {
        const xv = xSource[indices[i]];
        if (!Number.isNaN(xv)) {
          if (xv < xMin) xMin = xv;
          if (xv > xMax) xMax = xv;
        }
      }

      let yMin = Infinity;
      let yMax = -Infinity;
      for (const col of yCols) {
        const yArr = state.columnData.get(col);
        for (let i = 0; i < indices.length; i++) {
          const yv = yArr[indices[i]];
          if (!Number.isNaN(yv)) {
            if (yv < yMin) yMin = yv;
            if (yv > yMax) yMax = yv;
          }
        }
      }

      if (!Number.isFinite(xMin) || !Number.isFinite(xMax)) {
        xMin = 0;
        xMax = 1;
      } else if (xMin === xMax) {
        const padX = xCol === "Time" ? 60000 : (Math.abs(xMin) * 0.05 || 1);
        xMin -= padX;
        xMax += padX;
      } else {
        // Add 3% horizontal margin like Matplotlib default
        const spanX = xMax - xMin;
        xMin -= spanX * 0.025;
        xMax += spanX * 0.025;
      }

      if (!Number.isFinite(yMin) || !Number.isFinite(yMax)) {
        yMin = 0;
        yMax = 1;
      } else if (yMin === yMax) {
        const padY = Math.abs(yMin) * 0.05 || 1;
        yMin -= padY;
        yMax += padY;
      } else {
        // Add 5% vertical margin like Matplotlib default
        const spanY = yMax - yMin;
        yMin -= spanY * 0.05;
        yMax += spanY * 0.05;
      }

      const yMinText = editYMin.value.trim();
      const yMaxText = editYMax.value.trim();
      if (yMinText.length > 0 || yMaxText.length > 0) {
        const customYMin = yMinText.length > 0 ? Number(yMinText) : yMin;
        const customYMax = yMaxText.length > 0 ? Number(yMaxText) : yMax;
        if (Number.isNaN(customYMin) || Number.isNaN(customYMax)) {
          throw new Error("y축 범위에 유효한 숫자를 입력해 주세요.");
        }
        if (customYMin >= customYMax) {
          throw new Error("y축 최소값은 y축 최대값보다 작아야 합니다.");
        }
        yMin = customYMin;
        yMax = customYMax;
      }

      state.currentPlotIndices = indices;
      state.hasActivePlot = true;
      state.hoverPoint = null;
      state.plotBounds = { xMin, xMax, yMin, yMax };
      state.initialBounds = { xMin, xMax, yMin, yMax };
      state.viewHistory = [{ xMin, xMax, yMin, yMax }];
      state.viewHistoryIdx = 0;

      renderGraph();
      updateAnalysisText(indices, xCol, yCols);
    } catch (err) {
      showMessage("그래프 출력 오류", `그래프 출력 중 오류가 발생했습니다.\n\n${err.message || err}`);
    }
  }

  // ==============================================================================================
  // High-Performance Matplotlib-Style Canvas Renderer
  // ==============================================================================================
  function resizeCanvas() {
    const rect = canvasContainer.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    plotCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
    plotCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
    renderGraph();
  }
