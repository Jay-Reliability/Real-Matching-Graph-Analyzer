  function drawEmptyGraph() {
    state.hasActivePlot = false;
    state.hoverPoint = null;
    renderGraph();
  }

  function computeNiceTicks(min, max, maxTicks = 8) {
    const span = max - min;
    if (!(span > 0) || !Number.isFinite(span)) return [min];
    const rawStep = span / Math.max(2, maxTicks);
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const residual = rawStep / mag;
    let step;
    if (residual > 5) step = 10 * mag;
    else if (residual > 2) step = 5 * mag;
    else if (residual > 1) step = 2 * mag;
    else step = mag;

    const first = Math.ceil(min / step) * step;
    const ticks = [];
    for (let v = first; v <= max + step * 1e-7; v += step) {
      ticks.push(Number(v.toPrecision(12)));
      if (ticks.length > 20) break;
    }
    return ticks;
  }

  function computeTimeTicks(minMs, maxMs, maxTicks = 7) {
    const span = maxMs - minMs;
    if (!(span > 0) || !Number.isFinite(span)) return [minMs];
    const intervals = [
      1000,               // 1s
      5000,               // 5s
      10000,              // 10s
      30000,              // 30s
      60000,              // 1m
      5 * 60000,          // 5m
      10 * 60000,         // 10m
      15 * 60000,         // 15m
      30 * 60000,         // 30m
      3600000,            // 1h
      2 * 3600000,        // 2h
      3 * 3600000,        // 3h
      6 * 3600000,        // 6h
      12 * 3600000,       // 12h
      24 * 3600000,       // 1d
      2 * 24 * 3600000,   // 2d
      7 * 24 * 3600000    // 7d
    ];
    let step = intervals[intervals.length - 1];
    for (const iv of intervals) {
      if (span / iv <= maxTicks) {
        step = iv;
        break;
      }
    }
    const first = Math.ceil(minMs / step) * step;
    const ticks = [];
    for (let t = first; t <= maxMs; t += step) {
      ticks.push(t);
      if (ticks.length > 15) break;
    }
    if (ticks.length === 0) {
      ticks.push(minMs, maxMs);
    }
    return ticks;
  }

  function renderGraphToContext(ctx, cssWidth, cssHeight, includeHover = true) {
    ctx.save();
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, cssWidth, cssHeight);

    const padLeftPx = 74;
    const padRightPx = 24;
    const padTopPx = 42;
    const padBottomPx = 48;
    const plotW = Math.max(40, cssWidth - padLeftPx - padRightPx);
    const plotH = Math.max(40, cssHeight - padTopPx - padBottomPx);

    const area = {
      left: padLeftPx,
      top: padTopPx,
      right: padLeftPx + plotW,
      bottom: padTopPx + plotH,
      width: plotW,
      height: plotH
    };
    state.plotArea = area;

    const bounds = state.hasActivePlot && state.plotBounds
      ? state.plotBounds
      : { xMin: 0, xMax: 1, yMin: 0, yMax: 1 };

    const xTicks = state.hasActivePlot && state.currentXCol === "Time"
      ? computeTimeTicks(bounds.xMin, bounds.xMax, Math.max(4, Math.floor(plotW / 120)))
      : computeNiceTicks(bounds.xMin, bounds.xMax, Math.max(4, Math.floor(plotW / 100)));
    const yTicks = computeNiceTicks(bounds.yMin, bounds.yMax, Math.max(4, Math.floor(plotH / 50)));

    // 1. Draw Dashed Grid (alpha=0.35 matching Matplotlib)
    ctx.strokeStyle = "rgba(120, 130, 145, 0.35)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);

    for (const xt of xTicks) {
      const px = area.left + ((xt - bounds.xMin) / (bounds.xMax - bounds.xMin)) * area.width;
      if (px >= area.left && px <= area.right) {
        ctx.beginPath();
        ctx.moveTo(px, area.top);
        ctx.lineTo(px, area.bottom);
        ctx.stroke();
      }
    }

    for (const yt of yTicks) {
      const py = area.bottom - ((yt - bounds.yMin) / (bounds.yMax - bounds.yMin)) * area.height;
      if (py >= area.top && py <= area.bottom) {
        ctx.beginPath();
        ctx.moveTo(area.left, py);
        ctx.lineTo(area.right, py);
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);

    // 2. Plot Data Series (with min-max pixel bucket decimation when > 2000 points for instant 60fps rendering)
    if (state.hasActivePlot && state.currentPlotIndices && state.currentPlotIndices.length > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(area.left, area.top, area.width, area.height);
      ctx.clip();

      const indices = state.currentPlotIndices;
      const n = indices.length;
      const xArr = state.currentXCol === "Time" ? state.timeMs : state.columnData.get(state.currentXCol);
      const xSpan = bounds.xMax - bounds.xMin;
      const ySpan = bounds.yMax - bounds.yMin;

      state.currentYCols.forEach((col, sIdx) => {
        const yArr = state.columnData.get(col);
        if (!yArr) return;
        const color = COLOR_CYCLE[sIdx % COLOR_CYCLE.length];
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.7;
        ctx.lineJoin = "round";
        ctx.beginPath();

        if (n <= area.width * 2) {
          let started = false;
          for (let i = 0; i < n; i++) {
            const rIdx = indices[i];
            const xv = xArr[rIdx];
            const yv = yArr[rIdx];
            if (Number.isNaN(xv) || Number.isNaN(yv)) {
              started = false;
              continue;
            }
            const px = area.left + ((xv - bounds.xMin) / xSpan) * area.width;
            const py = area.bottom - ((yv - bounds.yMin) / ySpan) * area.height;
            if (!started) {
              ctx.moveTo(px, py);
              started = true;
            } else {
              ctx.lineTo(px, py);
            }
          }
        } else {
          // Pixel-column min/max envelope rendering for large datasets (100k+ points)
          const numBuckets = Math.max(100, Math.floor(area.width));
          const bucketFirstY = new Float64Array(numBuckets).fill(NaN);
          const bucketLastY = new Float64Array(numBuckets).fill(NaN);
          const bucketMinY = new Float64Array(numBuckets).fill(Infinity);
          const bucketMaxY = new Float64Array(numBuckets).fill(-Infinity);

          for (let i = 0; i < n; i++) {
            const rIdx = indices[i];
            const xv = xArr[rIdx];
            if (xv < bounds.xMin || xv > bounds.xMax || Number.isNaN(xv)) continue;
            const yv = yArr[rIdx];
            if (Number.isNaN(yv)) continue;

            let b = Math.floor(((xv - bounds.xMin) / xSpan) * numBuckets);
            if (b < 0) b = 0;
            if (b >= numBuckets) b = numBuckets - 1;

            if (Number.isNaN(bucketFirstY[b])) {
              bucketFirstY[b] = yv;
            }
            bucketLastY[b] = yv;
            if (yv < bucketMinY[b]) bucketMinY[b] = yv;
            if (yv > bucketMaxY[b]) bucketMaxY[b] = yv;
          }

          let started = false;
          for (let b = 0; b < numBuckets; b++) {
            if (Number.isNaN(bucketFirstY[b])) continue;
            const px = area.left + ((b + 0.5) / numBuckets) * area.width;
            const pyFirst = area.bottom - ((bucketFirstY[b] - bounds.yMin) / ySpan) * area.height;
            const pyMin = area.bottom - ((bucketMinY[b] - bounds.yMin) / ySpan) * area.height;
            const pyMax = area.bottom - ((bucketMaxY[b] - bounds.yMin) / ySpan) * area.height;
            const pyLast = area.bottom - ((bucketLastY[b] - bounds.yMin) / ySpan) * area.height;

            if (!started) {
              ctx.moveTo(px, pyFirst);
              started = true;
            } else {
              ctx.lineTo(px, pyFirst);
            }
            if (pyMax !== pyMin) {
              ctx.lineTo(px, pyMin);
              ctx.lineTo(px, pyMax);
              ctx.lineTo(px, pyLast);
            }
          }
        }
        ctx.stroke();
      });

      ctx.restore();
    }

    // 3. Axes Border Box
    ctx.strokeStyle = "#1F2933";
    ctx.lineWidth = 1;
    ctx.strokeRect(area.left, area.top, area.width, area.height);

    // 4. Tick Marks & Labels
    ctx.fillStyle = "#1F2933";
    ctx.font = '9.5pt "Malgun Gothic", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    for (const xt of xTicks) {
      const px = area.left + ((xt - bounds.xMin) / (bounds.xMax - bounds.xMin)) * area.width;
      if (px < area.left - 1 || px > area.right + 1) continue;
      ctx.beginPath();
      ctx.moveTo(px, area.bottom);
      ctx.lineTo(px, area.bottom + 5);
      ctx.stroke();

      let label = "";
      if (state.hasActivePlot && state.currentXCol === "Time") {
        label = formatTimeForAxis(xt, state.hasYearOver1900);
      } else {
        label = Number(xt.toPrecision(6)).toString();
      }
      ctx.fillText(label, px, area.bottom + 7);
    }

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (const yt of yTicks) {
      const py = area.bottom - ((yt - bounds.yMin) / (bounds.yMax - bounds.yMin)) * area.height;
      if (py < area.top - 1 || py > area.bottom + 1) continue;
      ctx.beginPath();
      ctx.moveTo(area.left - 5, py);
      ctx.lineTo(area.left, py);
      ctx.stroke();

      const label = Number(yt.toPrecision(7)).toString();
      ctx.fillText(label, area.left - 8, py);
    }

    // 5. Title & Axis Labels
    ctx.fillStyle = "#102A43";
    ctx.font = 'bold 13pt "Malgun Gothic", sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let titleText = "실사용 매칭시험 CSV 파일 Analyzer";
    if (state.hasActivePlot) {
      const titleCols = state.currentYCols.slice(0, 6).join(", ") + (state.currentYCols.length > 6 ? " ..." : "");
      titleText = `${state.fileName} | ${titleCols}`;
    }
    ctx.fillText(titleText, area.left + area.width / 2, area.top / 2);

    // X-Axis Label
    ctx.font = '10pt "Malgun Gothic", sans-serif';
    const xLabel = state.hasActivePlot && state.currentXCol !== "Time" ? state.currentXCol : "Time";
    ctx.fillText(xLabel, area.left + area.width / 2, cssHeight - 13);

    // Y-Axis Label
    ctx.save();
    ctx.translate(18, area.top + area.height / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Value", 0, 0);
    ctx.restore();

    // 6. Legend Box (Matplotlib frameon=True style)
    if (state.hasActivePlot && state.currentYCols.length > 0) {
      drawLegend(ctx, area);
    }

    // 7. Zoom Rectangle Overlay
    if (includeHover && state.isDragging && state.toolMode === "zoom" && state.dragStart && state.dragCurrent) {
      const rx = Math.min(state.dragStart.x, state.dragCurrent.x);
      const ry = Math.min(state.dragStart.y, state.dragCurrent.y);
      const rw = Math.abs(state.dragCurrent.x - state.dragStart.x);
      const rh = Math.abs(state.dragCurrent.y - state.dragStart.y);
      ctx.fillStyle = "rgba(47, 128, 237, 0.14)";
      ctx.fillRect(rx, ry, rw, rh);
      ctx.strokeStyle = "#2F80ED";
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.setLineDash([]);
    }

    // 8. Hover Annotation Tooltip (Matches fc="#FFF8DC", ec="#777777", arrow in 01_Matching_Test_Graph_Analyzer_1.py)
    if (includeHover && state.hoverPoint && state.hasActivePlot) {
      drawHoverAnnotation(ctx, area, state.hoverPoint);
    }

    ctx.restore();
  }

  function drawLegend(ctx, area) {
    ctx.save();
    ctx.font = '9pt "Malgun Gothic", sans-serif';
    const items = state.currentYCols;
    const maxItemsShown = Math.min(items.length, 14);
    const lineH = 18;
    const sampleLineW = 22;
    const padX = 8;
    const padY = 6;

    let maxTextW = 0;
    for (let i = 0; i < maxItemsShown; i++) {
      const w = ctx.measureText(items[i]).width;
      if (w > maxTextW) maxTextW = w;
    }
    const extraRow = items.length > maxItemsShown ? 1 : 0;
    const boxW = sampleLineW + 8 + maxTextW + padX * 2;
    const boxH = (maxItemsShown + extraRow) * lineH + padY * 2;

    const boxX = area.right - boxW - 10;
    const boxY = area.top + 10;

    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.strokeStyle = "#CBD5E1";
    ctx.lineWidth = 1;
    roundRect(ctx, boxX, boxY, boxW, boxH, 4);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (let i = 0; i < maxItemsShown; i++) {
      const cy = boxY + padY + i * lineH + lineH / 2;
      const color = COLOR_CYCLE[i % COLOR_CYCLE.length];
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(boxX + padX, cy);
      ctx.lineTo(boxX + padX + sampleLineW, cy);
      ctx.stroke();

      ctx.fillStyle = "#1F2933";
      ctx.fillText(items[i], boxX + padX + sampleLineW + 7, cy);
    }

    if (extraRow) {
      const cy = boxY + padY + maxItemsShown * lineH + lineH / 2;
      ctx.fillStyle = "#64748B";
      ctx.fillText(`... 외 ${items.length - maxItemsShown}개`, boxX + padX, cy);
    }
    ctx.restore();
  }

  function drawHoverAnnotation(ctx, area, hp) {
    ctx.save();
    ctx.font = '9pt Consolas, "Malgun Gothic", monospace';

    const xLabel = state.currentXCol === "Time"
      ? formatTimeForHover(hp.xVal)
      : hp.xVal.toFixed(4);
    const lines = [
      hp.col,
      `x=${xLabel}`,
      `y=${hp.yVal.toFixed(4)}`
    ];

    let maxW = 0;
    for (const l of lines) {
      const w = ctx.measureText(l).width;
      if (w > maxW) maxW = w;
    }

    const lineH = 16;
    const padX = 8;
    const padY = 6;
    const boxW = maxW + padX * 2;
    const boxH = lines.length * lineH + padY * 2;

    let boxX = hp.screenX + 14;
    let boxY = hp.screenY - boxH - 14;
    if (boxX + boxW > area.right - 4) {
      boxX = hp.screenX - boxW - 14;
    }
    if (boxY < area.top + 4) {
      boxY = hp.screenY + 14;
    }

    // Highlight point circle
    ctx.fillStyle = hp.color || "#2F80ED";
    ctx.beginPath();
    ctx.arc(hp.screenX, hp.screenY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Connector line / arrow
    const targetCornerX = boxX < hp.screenX ? boxX + boxW : boxX;
    const targetCornerY = boxY < hp.screenY ? boxY + boxH : boxY;
    ctx.strokeStyle = "#777777";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(targetCornerX, targetCornerY);
    ctx.lineTo(hp.screenX, hp.screenY);
    ctx.stroke();

    // Rounded box fc="#FFF8DC", ec="#777777"
    ctx.fillStyle = "rgba(255, 248, 220, 0.95)";
    ctx.strokeStyle = "#777777";
    ctx.lineWidth = 1;
    roundRect(ctx, boxX, boxY, boxW, boxH, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#102A43";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    lines.forEach((line, idx) => {
      ctx.fillText(line, boxX + padX, boxY + padY + idx * lineH);
    });
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function renderGraph() {
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = plotCanvas.width / dpr;
    const cssHeight = plotCanvas.height / dpr;
    const ctx = plotCanvas.getContext("2d");
    ctx.save();
    ctx.scale(dpr, dpr);
    renderGraphToContext(ctx, cssWidth, cssHeight, true);
    ctx.restore();
  }

  // ==============================================================================================
  // Mouse Interaction (Hover Nearest Point, Pan, Zoom-to-Rect, Wheel Zoom, Toolbar)
  // ==============================================================================================
  function setToolMode(mode) {
    state.toolMode = state.toolMode === mode ? null : mode;
    toolPan.classList.toggle("active", state.toolMode === "pan");
    toolZoom.classList.toggle("active", state.toolMode === "zoom");
    plotCanvas.style.cursor = state.toolMode === "pan"
      ? "grab"
      : state.toolMode === "zoom"
        ? "crosshair"
        : "default";
  }

  toolPan.addEventListener("click", () => setToolMode("pan"));
  toolZoom.addEventListener("click", () => setToolMode("zoom"));

  toolHome.addEventListener("click", () => {
    if (!state.hasActivePlot || !state.initialBounds) return;
    pushViewBounds({ ...state.initialBounds });
    renderGraph();
  });

  toolBack.addEventListener("click", () => {
    if (state.viewHistoryIdx > 0) {
      state.viewHistoryIdx--;
      state.plotBounds = { ...state.viewHistory[state.viewHistoryIdx] };
      renderGraph();
    }
  });

  toolForward.addEventListener("click", () => {
    if (state.viewHistoryIdx < state.viewHistory.length - 1) {
      state.viewHistoryIdx++;
      state.plotBounds = { ...state.viewHistory[state.viewHistoryIdx] };
      renderGraph();
    }
  });

  toolSave.addEventListener("click", saveCurrentPlotJpg);

  function pushViewBounds(newBounds) {
    state.plotBounds = { ...newBounds };
    state.viewHistory = state.viewHistory.slice(0, state.viewHistoryIdx + 1);
    state.viewHistory.push({ ...newBounds });
    state.viewHistoryIdx = state.viewHistory.length - 1;
  }

  function findNearestPoint(mouseX, mouseY) {
    if (!state.hasActivePlot || !state.plotArea || !state.plotBounds || !state.currentPlotIndices) {
      return null;
    }
    const area = state.plotArea;
    if (mouseX < area.left || mouseX > area.right || mouseY < area.top || mouseY > area.bottom) {
      return null;
    }

    const bounds = state.plotBounds;
    const xSpan = bounds.xMax - bounds.xMin;
    const ySpan = bounds.yMax - bounds.yMin;
    const cursorXVal = bounds.xMin + ((mouseX - area.left) / area.width) * xSpan;
    const indices = state.currentPlotIndices;
    const n = indices.length;
    if (n === 0) return null;

    const xArr = state.currentXCol === "Time" ? state.timeMs : state.columnData.get(state.currentXCol);

    // Binary search if X is Time (sorted), otherwise linear scan around cursor
    let candidateStart = 0;
    let candidateEnd = n - 1;
    if (state.currentXCol === "Time") {
      let lo = 0;
      let hi = n - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >>> 1;
        if (xArr[indices[mid]] < cursorXVal) lo = mid + 1;
        else hi = mid - 1;
      }
      candidateStart = Math.max(0, lo - 40);
      candidateEnd = Math.min(n - 1, lo + 40);
    }

    let best = null;
    state.currentYCols.forEach((col, sIdx) => {
      const yArr = state.columnData.get(col);
      if (!yArr) return;
      const color = COLOR_CYCLE[sIdx % COLOR_CYCLE.length];

      for (let i = candidateStart; i <= candidateEnd; i++) {
        const rIdx = indices[i];
        const xv = xArr[rIdx];
        const yv = yArr[rIdx];
        if (Number.isNaN(xv) || Number.isNaN(yv)) continue;
        const px = area.left + ((xv - bounds.xMin) / xSpan) * area.width;
        const py = area.bottom - ((yv - bounds.yMin) / ySpan) * area.height;
        const dist = Math.hypot(px - mouseX, py - mouseY);
        if (!best || dist < best.dist) {
          best = { dist, col, xVal: xv, yVal: yv, screenX: px, screenY: py, color };
        }
      }
    });

    if (best && best.dist <= 60) {
      return best;
    }
    return null;
  }

  plotCanvas.addEventListener("mousedown", (e) => {
    if (!state.hasActivePlot || !state.plotArea) return;
    const rect = plotCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const area = state.plotArea;
    if (x < area.left || x > area.right || y < area.top || y > area.bottom) return;

    if (state.toolMode === "pan" || state.toolMode === "zoom") {
      state.isDragging = true;
      state.dragStart = { x, y, bounds: { ...state.plotBounds } };
      state.dragCurrent = { x, y };
      state.hoverPoint = null;
      if (state.toolMode === "pan") plotCanvas.style.cursor = "grabbing";
    }
  });

  plotCanvas.addEventListener("mousemove", (e) => {
    const rect = plotCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (state.hasActivePlot && state.plotArea && state.plotBounds) {
      const area = state.plotArea;
      if (x >= area.left && x <= area.right && y >= area.top && y <= area.bottom) {
        const xVal = state.plotBounds.xMin + ((x - area.left) / area.width) * (state.plotBounds.xMax - state.plotBounds.xMin);
        const yVal = state.plotBounds.yMin + ((area.bottom - y) / area.height) * (state.plotBounds.yMax - state.plotBounds.yMin);
        const xText = state.currentXCol === "Time" ? formatTimeForHover(xVal) : xVal.toFixed(4);
        toolbarCoords.textContent = `x=${xText}, y=${yVal.toFixed(4)}`;
      } else {
        toolbarCoords.textContent = "";
      }
    }

    if (state.isDragging && state.dragStart && state.plotArea) {
      state.dragCurrent = { x, y };
      if (state.toolMode === "pan") {
        const area = state.plotArea;
        const b0 = state.dragStart.bounds;
        const dxRatio = (x - state.dragStart.x) / area.width;
        const dyRatio = (y - state.dragStart.y) / area.height;
        const xSpan = b0.xMax - b0.xMin;
        const ySpan = b0.yMax - b0.yMin;
        state.plotBounds = {
          xMin: b0.xMin - dxRatio * xSpan,
          xMax: b0.xMax - dxRatio * xSpan,
          yMin: b0.yMin + dyRatio * ySpan,
          yMax: b0.yMax + dyRatio * ySpan
        };
      }
      renderGraph();
      return;
    }

    const nearest = findNearestPoint(x, y);
    if (nearest !== state.hoverPoint) {
      state.hoverPoint = nearest;
      renderGraph();
    }
  });

  window.addEventListener("mouseup", () => {
    if (!state.isDragging) return;
    state.isDragging = false;
    if (state.toolMode === "pan") {
      plotCanvas.style.cursor = "grab";
      pushViewBounds(state.plotBounds);
    } else if (state.toolMode === "zoom" && state.dragStart && state.dragCurrent && state.plotArea) {
      const area = state.plotArea;
      const x1 = Math.max(area.left, Math.min(state.dragStart.x, state.dragCurrent.x));
      const x2 = Math.min(area.right, Math.max(state.dragStart.x, state.dragCurrent.x));
      const y1 = Math.max(area.top, Math.min(state.dragStart.y, state.dragCurrent.y));
      const y2 = Math.min(area.bottom, Math.max(state.dragStart.y, state.dragCurrent.y));

      if (x2 - x1 > 6 && y2 - y1 > 6) {
        const b = state.plotBounds;
        const newXMin = b.xMin + ((x1 - area.left) / area.width) * (b.xMax - b.xMin);
        const newXMax = b.xMin + ((x2 - area.left) / area.width) * (b.xMax - b.xMin);
        const newYMax = b.yMin + ((area.bottom - y1) / area.height) * (b.yMax - b.yMin);
        const newYMin = b.yMin + ((area.bottom - y2) / area.height) * (b.yMax - b.yMin);
        pushViewBounds({ xMin: newXMin, xMax: newXMax, yMin: newYMin, yMax: newYMax });
      }
      renderGraph();
    }
    state.dragStart = null;
    state.dragCurrent = null;
  });

  plotCanvas.addEventListener("mouseleave", () => {
    toolbarCoords.textContent = "";
    if (state.hoverPoint) {
      state.hoverPoint = null;
      renderGraph();
    }
  });

  // Mouse wheel zoom support
  plotCanvas.addEventListener("wheel", (e) => {
    if (!state.hasActivePlot || !state.plotArea || !state.plotBounds) return;
    e.preventDefault();
    const rect = plotCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const area = state.plotArea;
    if (x < area.left || x > area.right || y < area.top || y > area.bottom) return;

    const factor = e.deltaY < 0 ? 0.85 : 1.18;
    const b = state.plotBounds;
    const xRel = (x - area.left) / area.width;
    const yRel = (area.bottom - y) / area.height;
    const cx = b.xMin + xRel * (b.xMax - b.xMin);
    const cy = b.yMin + yRel * (b.yMax - b.yMin);

    const newXSpan = (b.xMax - b.xMin) * factor;
    const newYSpan = (b.yMax - b.yMin) * factor;
    pushViewBounds({
      xMin: cx - xRel * newXSpan,
      xMax: cx + (1 - xRel) * newXSpan,
      yMin: cy - yRel * newYSpan,
      yMax: cy + (1 - yRel) * newYSpan
    });
    renderGraph();
  }, { passive: false });

  // ==============================================================================================
  // Save CSV & Save JPG Functions (Matches save_current_plot_csv & save_current_plot_jpg)
  // ==============================================================================================
  function getBaseFileName(fallback) {
    if (!state.fileName) return fallback;
    const dotIdx = state.fileName.lastIndexOf(".");
    return dotIdx > 0 ? state.fileName.slice(0, dotIdx) : state.fileName;
  }

  function saveCurrentPlotCsv() {
    if (!state.hasActivePlot || !state.currentPlotIndices || state.currentPlotIndices.length === 0) {
      showMessage("저장할 데이터 없음", "먼저 그래프를 출력해 주세요.");
      return;
    }

    try {
      const defaultName = `${getBaseFileName("selected_plot_data")}_selected_plot_data.csv`;
      const cols = ["Time", "Time_dt"];
      if (state.currentXCol !== "Time" && !cols.includes(state.currentXCol)) {
        cols.push(state.currentXCol);
      }
      for (const y of state.currentYCols) {
        if (!cols.includes(y)) cols.push(y);
      }

      const indices = state.currentPlotIndices;
      const n = indices.length;
      const csvParts = ["\uFEFF" + cols.join(",") + "\n"];

      let chunkLines = [];
      for (let i = 0; i < n; i++) {
        const rIdx = indices[i];
        const rowCells = [
          state.timeStrings[rIdx],
          formatTimeForCsvSave(state.timeMs[rIdx])
        ];
        for (let c = 2; c < cols.length; c++) {
          const arr = state.columnData.get(cols[c]);
          const val = arr ? arr[rIdx] : NaN;
          rowCells.push(Number.isNaN(val) ? "" : String(val));
        }
        chunkLines.push(rowCells.join(","));
        if (chunkLines.length >= 5000) {
          csvParts.push(chunkLines.join("\n") + "\n");
          chunkLines = [];
        }
      }
      if (chunkLines.length > 0) {
        csvParts.push(chunkLines.join("\n") + "\n");
      }

      const blob = new Blob(csvParts, { type: "text/csv;charset=utf-8;" });
      triggerDownload(blob, defaultName);
      showMessage("CSV 저장 완료", `CSV 파일 저장이 완료되었습니다.\n\n${defaultName}`);
    } catch (err) {
      showMessage("CSV 저장 오류", `CSV 파일 저장 중 오류가 발생했습니다.\n\n${err.message || err}`);
    }
  }

  function saveCurrentPlotJpg() {
    if (!state.hasActivePlot || !state.currentPlotIndices || state.currentPlotIndices.length === 0) {
      showMessage("저장할 그래프 없음", "먼저 그래프를 출력해 주세요.");
      return;
    }

    try {
      const defaultName = `${getBaseFileName("selected_plot_graph")}_selected_plot_graph.jpg`;
      // Export at 200 DPI equivalent (figsize=(12, 6), dpi=200 -> 2400 x 1200)
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = 2400;
      exportCanvas.height = 1200;
      const ctx = exportCanvas.getContext("2d");
      ctx.save();
      ctx.scale(2, 2);
      renderGraphToContext(ctx, 1200, 600, false);
      ctx.restore();

      exportCanvas.toBlob((blob) => {
        if (!blob) {
          showMessage("JPG 저장 오류", "그래프 이미지 생성에 실패했습니다.");
          return;
        }
        triggerDownload(blob, defaultName);
        showMessage("JPG 저장 완료", `그래프 이미지 저장이 완료되었습니다.\n\n${defaultName}`);
      }, "image/jpeg", 0.95);
    } catch (err) {
      showMessage("JPG 저장 오류", `그래프 이미지 저장 중 오류가 발생했습니다.\n\n${err.message || err}`);
    }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  btnSaveCsv.addEventListener("click", saveCurrentPlotCsv);
  btnSaveJpg.addEventListener("click", saveCurrentPlotJpg);

  // ==============================================================================================
  // Exit Button
  // ==============================================================================================
  btnExit.addEventListener("click", () => {
    // Attempt window.close(); if blocked by browser security / iframe, reset workspace cleanly
    window.close();
    state.fileName = null;
    state.rowCount = 0;
    state.timeStrings = null;
    state.timeMs = null;
    state.zeroColumns = [];
    state.nonzeroColumns = [];
    state.columnData.clear();
    state.currentYCols = [];
    state.currentPlotIndices = null;
    state.hasActivePlot = false;

    lblFile.textContent = "선택된 파일: 없음";
    xList.innerHTML = "";
    yList.innerHTML = "";
    selectedYList.innerHTML = "";
    editXMin.value = "";
    editXMax.value = "";
    editYMin.value = "";
    editYMax.value = "";
    analysisText.value = "";
    document.getElementById("header-status").textContent = "프로그램이 초기화(종료)되었습니다";
    drawEmptyGraph();
    showMessage("프로그램 종료", "분석 세션이 종료되었습니다. (브라우저 탭을 닫거나 새 파일을 로드할 수 있습니다.)");
  });

  // Initial Draw
  requestAnimationFrame(() => {
    resizeCanvas();
  });
})();
</script>
</body>
</html>
